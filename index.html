<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gewölbe und Flugechsen</title>
    
    <script>
        const savedTheme = localStorage.getItem('dnd_theme') || 'standard';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 16px;
        }
        .menu-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Debug-Reset-Button (Käfer) oben rechts */
        .btn-debug-reset {
            position: fixed;
            top: 16px;
            right: 68px;
            z-index: 1100;
            background: var(--btn-back-bg);
            border: 1.5px solid #8b0000;
            color: #8b0000;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        .btn-debug-reset:hover {
            background: #8b0000;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Debug-Reset-Button (Käfer) -->
    <button class="btn-debug-reset" onclick="resetLocalStorage()" title="Speicher komplett leeren (Reset)">
        <i class="fa-solid fa-bug"></i>
    </button>

    <!-- Fixer Pinsel-Button oben rechts in der Bildschirmecke -->
    <button class="btn-theme-toggle" onclick="openThemeModal()" title="Design wählen">
        <i class="fa-solid fa-paintbrush"></i>
    </button>

    <svg style="display:none;" aria-hidden="true">
        <filter id="rough-edge">
            <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <div class="menu-container">
        <div class="logo-frame">
            <div class="fantasy-landscape-icons" style="font-size: 1.5rem; color: var(--accent); margin-bottom: 12px; display: flex; justify-content: center; gap: 16px;">
                <i class="fa-solid fa-mountain"></i>
                <i class="fa-solid fa-chess-rook"></i>
                <i class="fa-solid fa-dragon"></i>
            </div>

            <h1 style="font-size: 0.9rem; color: var(--text-muted); margin: 0 0 2px 0; text-transform: uppercase; font-family: serif; letter-spacing: 0.5px;">Gewölbe und Flugechsen</h1>
            <div style="font-size: 1.6rem; color: var(--text); font-weight: bold; margin-bottom: 4px; text-transform: uppercase; font-family: serif;">Heldenschmiede</div>
            <div class="subtitle" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; font-style: italic;">v.0.0.1</div>

            <a href="creator.html?mode=create" class="btn-gold-main">
                <i class="fa-solid fa-user-plus"></i> Helden erschaffen
            </a>
            
            <button class="btn-menu-main" onclick="openCharacterModal()">
                <i class="fa-solid fa-person-arrow-up-from-line"></i> Helden laden
            </button>
            
            <button class="btn-menu-main" onclick="openGraveyardModal()" style="color: var(--text-muted); margin-bottom: 0;">
                <i class="fa-solid fa-monument"></i> Heldenfriedhof
            </button>
        </div>
    </div>

    <!-- MODAL: Design / Theme Auswahl -->
    <div id="theme-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">
                <span>Design wählen<br></span>
            </div>
            
            <div class="modal-body" style="overflow: visible;">
                <button class="theme-option-btn" onclick="setTheme('standard')">
                    <span><i class="fa-solid fa-scroll" style="color: var(--accent); margin-right: 8px;"></i> Standard (Pergament)</span>
                    <i class="fa-solid fa-check" id="check-standard" style="display:none; color: var(--accent);"></i>
                </button>
                <button class="theme-option-btn" onclick="setTheme('dungeon')">
                    <span><i class="fa-solid fa-moon" style="color: var(--accent); margin-right: 8px;"></i> Dungeon (Dark Mode)</span>
                    <i class="fa-solid fa-check" id="check-dungeon" style="display:none; color: var(--accent);"></i>
                </button>
            </div>

            <button class="btn-gray-main" onclick="closeThemeModal()" style="margin-top: 10px;">Schließen</button>
        </div>
    </div>

    <!-- MODAL: Charakter-Auswahl -->
    <div id="char-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">
                <span>Wähle deinen Helden</span>
            </div>
            
            <div id="character-list-container" class="modal-body" style="max-height: 40vh; display: flex; flex-direction: column; gap: 10px;"></div>

            <button class="main-btn" onclick="closeCharacterModal()" style="margin-top: 10px; background: var(--btn-back-bg); color: var(--text); border: 1.5px solid var(--border);">Abbrechen</button>
        </div>
    </div>

    <!-- MODAL: Heldenfriedhof -->
    <div id="graveyard-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">
                <span><i class="fa-solid fa-monument"></i> Heldenfriedhof</span>
            </div>
            
            <div id="graveyard-list-container" class="modal-body" style="max-height: 40vh; display: flex; flex-direction: column; gap: 10px;"></div>

            <button class="btn-gray-main" onclick="closeGraveyardModal()" style="margin-top: 10px; background: var(--btn-back-bg); color: var(--text); border: 1.5px solid var(--border);">Schließen</button>
        </div>
    </div>

    <!-- MODAL: Custom Confirm Dialog (im Seiten-Design) -->
    <div id="custom-confirm-modal" class="modal-overlay" style="display:none; z-index: 9999;">
        <div class="modal-content" style="text-align: center; max-width: 320px;">
            <div class="modal-title" style="justify-content: center;">
                <span id="confirm-title">Titel</span>
            </div>
            <div class="modal-body" style="font-size: 0.9rem; color: var(--text); margin: 15px 0;">
                <div id="confirm-text" style="font-weight: bold; margin-bottom: 8px;">Frage</div>
                <div id="confirm-subtext" style="font-size: 0.75rem; color: var(--text-muted); font-style: italic;">Untertext</div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="confirm-yes-btn" class="main-btn" style="flex: 1; background: var(--btn-back-bg); color: var(--text); border: 1.5px solid var(--border); margin-bottom: 0;">Ja</button>
                <button id="confirm-no-btn" class="main-btn" style="flex: 1; background: var(--btn-back-bg); color: var(--text); border: 1.5px solid var(--border); margin-bottom: 0;">Nein</button>
            </div>
        </div>
    </div>

    <script>
        function openThemeModal() {
            const current = localStorage.getItem('dnd_theme') || 'standard';
            document.getElementById('check-standard').style.display = current === 'standard' ? 'inline' : 'none';
            document.getElementById('check-dungeon').style.display = current === 'dungeon' ? 'inline' : 'none';
            document.getElementById('theme-modal').style.display = 'flex';
        }
        function closeThemeModal() { document.getElementById('theme-modal').style.display = 'none'; }
        function setTheme(themeName) {
            localStorage.setItem('dnd_theme', themeName);
            document.documentElement.setAttribute('data-theme', themeName);
            closeThemeModal();
        }

        function getStoredCharacters() {
            let characters = [];
            const savedList = localStorage.getItem('dnd_character_list');
            const singleSaved = localStorage.getItem('dnd_active_character');
            if (savedList) { try { characters = JSON.parse(savedList); } catch(e) {} }
            else if (singleSaved) { try { characters = [JSON.parse(singleSaved)]; } catch(e) {} }
            return characters;
        }
        function saveStoredCharacters(characters) { localStorage.setItem('dnd_character_list', JSON.stringify(characters)); }

        function openCharacterModal() {
            const container = document.getElementById('character-list-container');
            container.innerHTML = '';
            const characters = getStoredCharacters().filter(c => !c.archived);
            if (characters.length === 0) {
                container.innerHTML = `<div style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">Keine aktiven Helden gefunden...</div>`;
            } else {
                characters.forEach((char) => {
                    const item = document.createElement('div');
                    item.style.cssText = "background: var(--btn-back-bg); border: 1.5px solid var(--border); border-radius: 6px; padding: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;";
                    item.onclick = () => selectCharacter(char.id);
                    item.innerHTML = `
                        <div>
                            <div style="font-weight: bold; color: var(--text);">${char.name || "Held"} (Stufe ${char.level || 1})</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted);">${char.class || "-"} | ${char.species || "-"}</div>
                        </div>
                        <button onclick="handleArchiveClick(event, '${char.id}', '${char.name || "Held"}')" style="background:none; border:none; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex-shrink:0;"><i class="fa-solid fa-monument" style="font-size: 1.4rem; color: var(--text-muted);"></i></button>
                    `;
                    container.appendChild(item);
                });
            }
            document.getElementById('char-modal').style.display = 'flex';
        }
        function closeCharacterModal() { document.getElementById('char-modal').style.display = 'none'; }
        
        function selectCharacter(id) {
            let characters = getStoredCharacters();
            const index = characters.findIndex(c => c.id === id);
            if (index >= 0) {
                characters[index].lastAccess = new Date().toISOString();
                saveStoredCharacters(characters);
                localStorage.setItem('dnd_active_character', JSON.stringify(characters[index]));
            }
            // Leitet direkt zum Creator im Sheet-Modus weiter, damit er auf dem Heldenbogen landet
            window.location.href = 'creator.html?mode=sheet';
        }

        function showCustomConfirm(title, text, subtext, onYes) {
            const modal = document.getElementById('custom-confirm-modal');
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-text').innerText = text;
            document.getElementById('confirm-subtext').innerText = subtext;
            modal.style.display = 'flex';

            const yesBtn = document.getElementById('confirm-yes-btn');
            const noBtn = document.getElementById('confirm-no-btn');

            const newYes = yesBtn.cloneNode(true);
            const newNo = noBtn.cloneNode(true);
            yesBtn.parentNode.replaceChild(newYes, yesBtn);
            noBtn.parentNode.replaceChild(newNo, noBtn);

            newYes.addEventListener('click', () => {
                modal.style.display = 'none';
                onYes();
            });

            newNo.addEventListener('click', () => {
                modal.style.display = 'none';
            });
        }

        function handleArchiveClick(event, id, name) {
            event.stopPropagation();
            showCustomConfirm(
                "Helden begraben?",
                `"${name}" wirklich in den Heldenfriedhof überführen?`,
                "",
                () => {
                    let characters = getStoredCharacters();
                    const index = characters.findIndex(c => c.id === id);
                    if (index >= 0) { 
                        characters[index].archived = true; 
                        saveStoredCharacters(characters); 
                        openCharacterModal(); 
                    }
                }
            );
        }

        function openGraveyardModal() {
            const container = document.getElementById('graveyard-list-container');
            container.innerHTML = '';
            const characters = getStoredCharacters().filter(c => c.archived);
            if (characters.length === 0) {
                container.innerHTML = `<div style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">Der Friedhof ist leer.</div>`;
            } else {
                characters.forEach((char) => {
                    const item = document.createElement('div');
                    item.style.cssText = "background: var(--btn-back-bg); border: 1.5px solid var(--border); border-radius: 6px; padding: 10px; display: flex; justify-content: space-between; align-items: center;";
                    item.innerHTML = `
                        <div>
                            <div style="font-weight: bold; color: var(--text);">${char.name || "Held"}</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted);">${char.class || "-"}</div>
                        </div>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <button onclick="handleRestoreClick(event, '${char.id}', '${char.name || "Held"}')" style="background:none; border:none; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex-shrink:0;"><i class="fa-solid fa-person-arrow-up-from-line" style="font-size: 1.4rem; color: var(--text-muted);"></i></button>
                            <button onclick="handleDeletePermanentlyClick(event, '${char.id}', '${char.name || "Held"}')" style="background:none; border:none; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex-shrink:0;"><i class="fa-solid fa-trash-can" style="font-size: 1.4rem; color: #a94442;"></i></button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }
            document.getElementById('graveyard-modal').style.display = 'flex';
        }
        function closeGraveyardModal() { document.getElementById('graveyard-modal').style.display = 'none'; }
        
        function handleRestoreClick(event, id, name) {
            event.stopPropagation();
            showCustomConfirm(
                "Helden wiederbeleben?",
                `Möchtest du "${name}" wiederbeleben?`,
                "Du weißt was wir von Nekromantie halten!",
                () => {
                    let characters = getStoredCharacters();
                    const index = characters.findIndex(c => c.id === id);
                    if (index >= 0) { 
                        delete characters[index].archived; 
                        saveStoredCharacters(characters); 
                        openGraveyardModal(); 
                    }
                }
            );
        }

        function handleDeletePermanentlyClick(event, id, name) {
            event.stopPropagation();
            showCustomConfirm(
                "Endgültig löschen?",
                `Soll die Seele von "${name}" für alle Ewigkeit in der Leere verschwinden?`,
                "",
                () => {
                    let characters = getStoredCharacters();
                    characters = characters.filter(c => c.id !== id);
                    saveStoredCharacters(characters);
                    openGraveyardModal();
                }
            );
        }

        function resetLocalStorage() {
            if (confirm("Möchtest du wirklich den gesamten lokalen Speicher leeren? Alle gespeicherten Helden und Einstellungen gehen verloren.")) {
                localStorage.clear();
                alert("Speicher erfolgreich geleert!");
                location.reload();
            }
        }
    </script>
</body>
</html>
