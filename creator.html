<script>
let currentPage = 'create';
let lastBuiltCharacter = null;

function showCustomAlert(text, title = "Hinweis") {
    document.getElementById('custom-alert-title').innerText = title;
    document.getElementById('custom-alert-text').innerText = text;
    document.getElementById('custom-alert-modal').style.display = 'flex';
}

function closeCustomAlert() {
    document.getElementById('custom-alert-modal').style.display = 'none';
}

function requestSwitchToSheet() {
    document.getElementById('change-confirm-modal').style.display = 'flex';
}

function confirmPageSwitch(doSave) {
    document.getElementById('change-confirm-modal').style.display = 'none';
    if (doSave) {
        buildCharacterAndSave();
    } else {
        loadExistingOrFallbackCharacter();
    }
    executePageSwitch('sheet');
}

function switchToCreate() {
    if (lastBuiltCharacter) {
        loadCharacterIntoCreator(lastBuiltCharacter);
    }
    executePageSwitch('create');
}

function executePageSwitch(targetPage) {
    currentPage = targetPage;
    const wrapper = document.getElementById('bookWrapper');
    const footerContainer = document.getElementById('footerNavContainer');

    if (targetPage === 'sheet') {
        wrapper.style.transform = 'translateX(-100vw)';
        footerContainer.innerHTML = `
            <button type="button" class="footer-tab-btn" onclick="switchToCreate()">
                <i class="fa-solid fa-feather"></i> Held bearbeiten
            </button>
        `;
    } else {
        wrapper.style.transform = 'translateX(0vw)';
        footerContainer.innerHTML = `
            <button type="button" class="footer-tab-btn" onclick="requestSwitchToSheet()">
                <i class="fa-solid fa-shield-halved"></i> Zum Heldenbogen
            </button>
        `;
    }
}

function openThemeModal() {
    const current = localStorage.getItem('dnd_theme') || 'standard';
    document.getElementById('check-standard').style.display = current === 'standard' ? 'inline' : 'none';
    document.getElementById('check-dungeon').style.display = current === 'dungeon' ? 'inline' : 'none';
    document.getElementById('theme-modal').style.display = 'flex';
}
function closeThemeModal() { document.getElementById('theme-modal').style.display = 'none'; }
function setTheme(themeName) {
    localStorage.setItem('dnd_theme', themeName);
    document.documentElement.setAttribute('data-theme', themeName);
    closeThemeModal();
}

// =========================================
// JSON-URLS (ANPASST!)
// =========================================
const RACES_JSON_URL = "./rassen.json";
const BACKGROUNDS_JSON_URL = "./hintergruende.json";
const CLASSES_JSON_URL = "./klassen.json";
const SPELLS_JSON_URL = "./zauber.json";

const standardArray = [15, 14, 13, 12, 10, 8];

const attributeDescriptions = {
    "STR": "<b>Stärke:</b> Athletik, Nahkampfangriffe, Tragekapazität.",
    "DEX": "<b>Geschicklichkeit:</b> Akrobatik, Fingerfertigkeit, Heimlichkeit, RK, Initiative.",
    "CON": "<b>Konstitution:</b> Trefferpunkte, Konzentrationswürfe.",
    "INT": "<b>Intelligenz:</b> Arkankunde, Geschichte, Untersuchung, Naturkunde, Religion.",
    "WIS": "<b>Weisheit:</b> Tierumgang, Einblick, Heilkunde, Wahrnehmung, Überleben.",
    "CHA": "<b>Charisma:</b> Täuschen, Einschüchtern, Auftreten, Überzeugen."
};

const attrNamesDE = {
    "STR": "Stärke", "DEX": "Geschicklichkeit", "CON": "Konstitution",
    "INT": "Intelligenz", "WIS": "Weisheit", "CHA": "Charisma"
};

// =========================================
// DATEN-STRUKTUREN (WERDEN AUS JSON GELADEN)
// =========================================
let speciesData = {};
let backgrounds = {};
let classData = {};
let allSpells = { cantrips: {}, level1: {} };

window.onload = async function() {
    try {
        // RASSEN LADEN (rassen.json)
        const racesResponse = await fetch(RACES_JSON_URL + "?nocache=" + Date.now());
        if (!racesResponse.ok) throw new Error(`HTTP Fehler: ${racesResponse.status}`);
        const racesText = await racesResponse.text();
        const racesData = JSON.parse(racesText);
        speciesData = racesData.races || {};

        // HINTERGRÜNDE LADEN (hintergruende.json)
        const bgResponse = await fetch(BACKGROUNDS_JSON_URL + "?nocache=" + Date.now());
        if (bgResponse.ok) {
            const bgText = await bgResponse.text();
            const bgData = JSON.parse(bgText);
            backgrounds = bgData.backgrounds || bgData;
        } else {
            throw new Error(`HTTP Fehler: hintergruende.json (${bgResponse.status})`);
        }

        // KLASSEN LADEN (klassen.json)
        const classesResponse = await fetch(CLASSES_JSON_URL + "?nocache=" + Date.now());
        if (classesResponse.ok) {
            const classesText = await classesResponse.text();
            const classesRaw = JSON.parse(classesText);
            classData = classesRaw.classes || classesRaw;
        } else {
            throw new Error(`HTTP Fehler: klassen.json (${classesResponse.status})`);
        }

        // ZAUBER LADEN (zauber.json)
        const spellsResponse = await fetch(SPELLS_JSON_URL + "?nocache=" + Date.now());
        if (spellsResponse.ok) {
            const spellsText = await spellsResponse.text();
            const spellsRaw = JSON.parse(spellsText);
            const spellsObj = spellsRaw.spells || {};
            for (let spellName in spellsObj) {
                const spell = spellsObj[spellName];
                if (spell.level === 0) {
                    allSpells.cantrips[spellName] = spell;
                } else if (spell.level === 1) {
                    allSpells.level1[spellName] = spell;
                }
            }
        } else {
            console.warn("Warnung: Zauber-JSON konnte nicht geladen werden");
        }

        initApp();
        handleUrlModeAndStartup();
    } catch (err) {
        showCustomAlert("Ladefehler: " + err.message, "Fehler");
    }
};

function handleUrlModeAndStartup() {
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');

    if (mode === 'create') {
        localStorage.removeItem('dnd_active_character');
        lastBuiltCharacter = null;
        executePageSwitch('create');
    } else {
        const activeCharJson = localStorage.getItem('dnd_active_character');
        if (activeCharJson) {
            try {
                const char = JSON.parse(activeCharJson);
                lastBuiltCharacter = char;
                loadCharacterIntoCreator(char);
                renderCharacterToSheet(char);
                executePageSwitch('sheet');
                return;
            } catch (e) {}
        }
        buildCharacterAndSave();
        executePageSwitch('create');
    }
}

function loadExistingOrFallbackCharacter() {
    const activeCharJson = localStorage.getItem('dnd_active_character');
    if (activeCharJson) {
        try {
            lastBuiltCharacter = JSON.parse(activeCharJson);
            renderCharacterToSheet(lastBuiltCharacter);
            return;
        } catch (e) {}
    }
    buildCharacterAndSave();
}

function loadCharacterIntoCreator(char) {
    if (!char) return;
    if (char.name && document.getElementById('char-name')) document.getElementById('char-name').value = char.name;
    
    if (char.mainRace && document.getElementById('main-race')) {
        document.getElementById('main-race').value = char.mainRace;
        onMainRaceChange();
    }
    if (char.species && document.getElementById('sub-race')) {
        document.getElementById('sub-race').value = char.species;
    }
    
    if (char.class && document.getElementById('class-select')) {
        document.getElementById('class-select').value = char.class;
        onClassChange();
    }

    if (char.background && document.getElementById('bg-select')) {
        document.getElementById('bg-select').value = char.background;
        onBgChange();
    }

    if (char.rawStats) {
        if (document.getElementById('str-val')) document.getElementById('str-val').value = char.rawStats.STR;
        if (document.getElementById('dex-val')) document.getElementById('dex-val').value = char.rawStats.DEX;
        if (document.getElementById('con-val')) document.getElementById('con-val').value = char.rawStats.CON;
        if (document.getElementById('int-val')) document.getElementById('int-val').value = char.rawStats.INT;
        if (document.getElementById('wis-val')) document.getElementById('wis-val').value = char.rawStats.WIS;
        if (document.getElementById('cha-val')) document.getElementById('cha-val').value = char.rawStats.CHA;
    }

    if (char.skills && char.skills.length >= 2) {
        const bgSkills = backgrounds[char.background]?.skills || [];
        const customSkills = char.skills.filter(s => !bgSkills.includes(s));
        if (customSkills[0] && document.getElementById('skill1')) document.getElementById('skill1').value = customSkills[0];
        if (customSkills[1] && document.getElementById('skill2')) document.getElementById('skill2').value = customSkills[1];
    }
}

function buildCharacterAndSave() {
    if (!validateArray() || !validateSkills() || !validateBgAsi()) {
        showCustomAlert("Bitte behebe alle Validierungsfehler im Formular!", "Achtung");
        return;
    }

    const name = document.getElementById('char-name').value || "Unbenannter Held";
    const mainRace = document.getElementById('main-race').value || Object.keys(speciesData)[0];
    
    // FIX: subtypes.options statt subraces
    const raceData = speciesData[mainRace];
    const subRace = document.getElementById('sub-race').value || (raceData?.subtypes?.options?.[0]?.name);
    
    const clsName = document.getElementById('class-select').value || "Kämpfer";
    const bg = document.getElementById('bg-select').value || Object.keys(backgrounds)[0];
    
    // Geschwindigkeit aus Subtype oder Default
    const selectedSubtype = raceData?.subtypes?.options?.find(o => o.name === subRace);
    const subInfo = selectedSubtype || { bonus: {}, speed: 30 };

    let rawStats = {
        STR: parseInt(document.getElementById('str-val')?.value) || 15,
        DEX: parseInt(document.getElementById('dex-val')?.value) || 14,
        CON: parseInt(document.getElementById('con-val')?.value) || 13,
        INT: parseInt(document.getElementById('int-val')?.value) || 12,
        WIS: parseInt(document.getElementById('wis-val')?.value) || 10,
        CHA: parseInt(document.getElementById('cha-val')?.value) || 8
    };

    let speciesBonuses = subInfo.bonus || {};
    let bgBonuses = getBgBonuses();

    let stats = { ...rawStats };
    for (let s in stats) {
        if (speciesBonuses[s]) stats[s] += speciesBonuses[s];
        if (bgBonuses[s]) stats[s] += bgBonuses[s];
    }

    let mods = {};
    for (let s in stats) mods[s] = getMod(stats[s]);

    // HP aus Klassen-JSON
    const clsInfo = classData[clsName];
    const hpBase = clsInfo?.hpAt1stLevel ? parseInt(clsInfo.hpAt1stLevel) || 8 : 8;
    const hp = hpBase + mods.CON;
    const ac = 10 + mods.DEX;

    let chosenCantrips = Array.from(document.querySelectorAll('.char-cantrip-select')).map(s => s.value).filter(Boolean);
    let chosenSpells = Array.from(document.querySelectorAll('.char-spell-select')).map(s => s.value).filter(Boolean);
    const allSkills = [...(backgrounds[bg]?.skills || []), document.getElementById('skill1')?.value, document.getElementById('skill2')?.value].filter(Boolean);

    const charId = (lastBuiltCharacter && lastBuiltCharacter.id) ? lastBuiltCharacter.id : 'char_' + Date.now();

    lastBuiltCharacter = {
        id: charId, 
        name, 
        class: clsName, 
        species: subRace, 
        mainRace: mainRace,
        background: bg,
        level: 1, 
        hp, 
        maxHp: hp, 
        ac, 
        speed: subInfo.speed || 30, 
        stats, 
        mods, 
        rawStats,
        skills: allSkills, 
        cantrips: chosenCantrips, 
        spells: chosenSpells, 
        lastAccess: new Date().toISOString()
    };

    let list = JSON.parse(localStorage.getItem('dnd_character_list') || '[]');
    const index = list.findIndex(c => c.id === lastBuiltCharacter.id);
    if (index >= 0) {
        list[index] = lastBuiltCharacter;
    } else {
        list.push(lastBuiltCharacter);
    }

    localStorage.setItem('dnd_character_list', JSON.stringify(list));
    localStorage.setItem('dnd_active_character', JSON.stringify(lastBuiltCharacter));

    renderCharacterToSheet(lastBuiltCharacter);
}

function renderCharacterToSheet(charData) {
    if (!charData) return;
    
    document.getElementById('screen-out-name').innerHTML = `<i class="fa-solid ${getClassIcon(charData.class)}"></i> ${charData.name}`;
    document.getElementById('screen-out-meta').innerText = `${charData.species} | ${charData.class} Stufe ${charData.level || 1} | ${charData.background}`;
    document.getElementById('screen-out-hp').innerText = `HP: ${charData.hp}`;
    document.getElementById('screen-out-ac').innerText = `RK: ${charData.ac}`;
    document.getElementById('screen-out-init').innerText = `Initiative: ${charData.mods.DEX >= 0 ? '+' : ''}${charData.mods.DEX}`;
    document.getElementById('screen-out-prof').innerText = `Übungsbonus: +2`;
    document.getElementById('screen-out-speed').innerText = `Bewegungsrate: ${charData.speed || 30} ft`;

    document.getElementById('screen-out-stats').innerHTML = Object.keys(charData.stats).map(s => `
        <div class="stat-box" onclick="openModal('${s} Wert', '${attributeDescriptions[s]}')">
            <div style="font-size:0.75rem; color:var(--text-muted);">${s}</div>
            <div class="stat-val">${charData.stats[s]}</div>
            <div class="stat-mod">${charData.mods[s] >= 0 ? '+' : ''}${charData.mods[s]}</div>
        </div>`).join('');

    const bgObj = backgrounds[charData.background] || {};
    let bgCustomData = getSelectedBgEquipmentAndTools(charData.background);
    let flattenedTools = flattenEquipment(bgCustomData.tools);
    let flattenedEq = flattenEquipment(bgCustomData.equipment);
    let toolsStr = flattenedTools.join(', ') || 'Keine';
    let eqStr = flattenedEq.join(', ') || 'Keine';

    document.getElementById('screen-out-features').innerHTML = `
        <li><b>Fertigkeiten:</b> ${charData.skills.join(', ')}</li>
        <li><b>Volksmerkmale:</b> Geladener Charakter</li>
        <li><b>Talent:</b> ${bgObj.feat || ''}</li>
        <li><b>Werkzeuge:</b> ${toolsStr}</li>
        <li><b>Hintergrund-Ausrüstung:</b> ${eqStr}</li>
    `;

    renderEquipmentSectionInSheet(charData.class, bgCustomData);

    document.getElementById('screen-out-spells').innerHTML = `
        <div style="font-weight:bold; font-size:0.85rem; color:var(--text-muted);">Zaubertricks:</div>
        <div>${(charData.cantrips || []).join(', ') || 'Keine'}</div>
        <div style="margin-top:8px; font-weight:bold; font-size:0.85rem; color:var(--text-muted);">Vorbereitete Stufe 1 Zauber:</div>
        <div>${(charData.spells || []).join(', ') || 'Keine'}</div>
    `;
}

function initApp() {
    populateSelect('main-race', Object.keys(speciesData));
    
    const classSel = document.getElementById('class-select');
    classSel.innerHTML = '';
    Object.keys(classData).forEach(clsName => {
        classSel.innerHTML += `<option value="${clsName}">${clsName}</option>`;
    });

    populateSelect('bg-select', Object.keys(backgrounds));

    const arraySelects = document.querySelectorAll('.array-select');
    arraySelects.forEach((sel, idx) => {
        sel.innerHTML = '<option value="">--</option>';
        standardArray.forEach(val => sel.innerHTML += `<option value="${val}">${val}</option>`);
        sel.selectedIndex = idx + 1;
    });

    onMainRaceChange();
    onClassChange();
    updateBgDynamicUI();
}

function populateSelect(id, items) {
    const sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = '';
    items.forEach(i => sel.innerHTML += `<option value="${i}">${i}</option>`);
}

function openModal(title, text, iconClass = null, subtitle = null) {
    const titleElem = document.getElementById('modal-title');
    const subContainer = document.getElementById('modal-subtitle-container');
    const modalBody = document.getElementById('modal-body');
    const ruleModal = document.getElementById('rule-modal');

    if (!titleElem || !modalBody || !ruleModal) return;

    titleElem.innerHTML = iconClass ? `<span class="modal-icon-box"><i class="fa-solid ${iconClass}"></i></span> ${title}` : title;
    if (subContainer) {
        subContainer.innerHTML = subtitle ? `<div class="modal-subtitle">${subtitle}</div>` : '';
    }

    modalBody.innerHTML = text;
    ruleModal.style.display = 'flex';
    document.body.classList.add('modal-open');
}

function closeModal() {
    const ruleModal = document.getElementById('rule-modal');
    if (ruleModal) ruleModal.style.display = 'none';
    document.body.classList.remove('modal-open');
}

function showRaceModal() {
    const mainRace = document.getElementById('main-race').value;
    const subRace = document.getElementById('sub-race').value;
    const raceData = speciesData[mainRace];
    const selectedSubtype = raceData?.subtypes?.options?.find(o => o.name === subRace);
    
    if (selectedSubtype?.description) {
        openModal(subRace, selectedSubtype.description, "fa-child");
    } else {
        openModal(subRace, "Keine Beschreibung verfügbar.", "fa-child");
    }
}

async function showClassModal() {
    const clsName = document.getElementById('class-select').value;
    const clsInfo = classData[clsName];
    
    if (!clsInfo) {
        return openModal(clsName, `Keine Klassendaten für ${clsName} verfügbar.`, getClassIcon(clsName));
    }

    let modalContent = `<strong>Zusammenfassung:</strong> ${clsInfo.summary || 'Keine'}<br><br>`;
    modalContent += `<strong>Trefferwürfel:</strong> ${clsInfo.hitDice || 'N/A'}<br>`;
    modalContent += `<strong>Hauptattribut:</strong> ${clsInfo.primaryAbility || 'N/A'}<br>`;
    modalContent += `<strong>Rettungswürfe:</strong> ${clsInfo.savingThrows?.join(', ') || 'N/A'}<br><br>`;
    
    if (clsInfo.proficiencies) {
        modalContent += `<strong>Rüstungen:</strong> ${(clsInfo.proficiencies.armor || []).join(', ') || 'Keine'}<br>`;
        modalContent += `<strong>Waffen:</strong> ${(clsInfo.proficiencies.weapons || []).join(', ') || 'Keine'}<br>`;
    }
    
    if (clsInfo.features && clsInfo.features.length > 0) {
        modalContent += `<br><strong>Merkmal (Stufe 1):</strong><br>`;
        const lvl1Features = clsInfo.features.filter(f => f.level === 1);
        modalContent += lvl1Features.map(f => `• <b>${f.name}</b>: ${f.description}`).join('<br>');
    }

    openModal(clsName, modalContent, getClassIcon(clsName));
}

function showBgModal() {
    const b = document.getElementById('bg-select').value;
    const bg = backgrounds[b];
    if (!bg) return;
    openModal(b, `<b>Mögliche Attribute:</b> ${(bg.attributes || []).map(a => attrNamesDE[a] || a).join(', ')}<br><b>Talent:</b> ${bg.feat || ''}<br><b>Fertigkeiten:</b> ${(bg.skills || []).join(', ')}<br><br>${bg.text || ''}`, "fa-book");
}

function showSkillModal(selectId) {
    const skill = document.getElementById(selectId).value;
    openModal(skill, "Keine Beschreibung verfügbar.", "fa-check");
}

function showSpellModalFromDropdown(selectElem) {
    showSpellModalByName(selectElem.value);
}

function showSpellModalByName(spellName) {
    if (!spellName) return;
    
    let clean = spellName.replace(/ \((Racial|Auto|.*)\)/, '').trim();
    let spellObj = allSpells.cantrips[clean] || allSpells.level1[clean] || allSpells.cantrips[spellName] || allSpells.level1[spellName];

    if (!spellObj) return openModal(clean, "Keine detaillierte Beschreibung verfügbar.", "fa-wand-magic-sparkles");

    let school = spellObj.school || "Zaubertrick";
    let html = `<strong>Schule:</strong> ${school}<br>`;
    html += `<strong>Zeitaufwand:</strong> ${spellObj.castingTime || 'N/A'}<br>`;
    html += `<strong>Reichweite:</strong> ${typeof spellObj.range === 'object' ? `${spellObj.range.qty} ${spellObj.range.unit}` : spellObj.range || 'N/A'}<br>`;
    html += `<strong>Komponenten:</strong> `;
    if (spellObj.components) {
        let comps = [];
        if (spellObj.components.V) comps.push('V');
        if (spellObj.components.G) comps.push('G');
        if (spellObj.components.M) comps.push('M');
        html += comps.join(', ') || 'Keine';
    }
    html += `<br><strong>Wirkungsdauer:</strong> ${typeof spellObj.duration === 'object' ? `${spellObj.duration.qty} ${spellObj.duration.unit}` : spellObj.duration || 'N/A'}<br><br>`;
    html += `<strong>Beschreibung:</strong><br>${spellObj.description || 'N/A'}`;

    if (spellObj.higherLevel) {
        html += `<br><br><em>${spellObj.higherLevel}</em>`;
    }

    openModal(clean, html, "fa-wand-magic-sparkles", school);
}

function showCalcModal(type) {
    if (!lastBuiltCharacter) return;
    const c = lastBuiltCharacter;
    let text = "";
    if (type === 'HP') text = `Basis (${c.class}): ${c.hp - c.mods.CON}<br>+ Konstitution (${c.mods.CON}): ${c.mods.CON}<br><b>Total: ${c.hp}</b>`;
    else if (type === 'RK') text = `Basis: 10<br>+ Geschicklichkeit (${c.mods.DEX}): ${c.mods.DEX}<br><b>Total: ${c.ac}</b>`;
    else if (type === 'Initiative') text = `Geschicklichkeits-Modifikator: ${c.mods.DEX}`;
    else if (type === 'Übungsbonus') text = `Stufe 1–4 = +2`;
    else if (type === 'Bewegungsrate') text = `${c.speed || 30} Fuß`;
    openModal(type, text, "fa-calculator");
}

function getClassIcon(className) {
    switch (className) {
        case "Artifizier": return "fa-wrench";
        case "Barbar": return "fa-hammer";
        case "Barde": return "fa-guitar";
        case "Kleriker": return "fa-cross";
        case "Druide": return "fa-tree";
        case "Kämpfer": return "fa-shield";
        case "Mönch": return "fa-ring";
        case "Paladin": return "fa-shield";
        case "Waldläufer": return "fa-crosshairs";
        case "Schurke": return "fa-dagger";
        case "Zauberer": return "fa-fire";
        case "Hexenmeister": return "fa-star-of-life";
        case "Magier": return "fa-hat-wizard";
        default: return "fa-user";
    }
}

function updateClassIconDisplay() {
    const c = document.getElementById('class-select').value;
    const iconElem = document.getElementById('class-icon-indicator');
    if (iconElem) iconElem.className = `fa-solid ${getClassIcon(c)}`;
}

// =========================================
// KORREKTUR: subtypes statt subraces
// =========================================
function onMainRaceChange() {
    const mainRace = document.getElementById('main-race').value;
    const subContainer = document.getElementById('subrace-container');
    const subSelect = document.getElementById('sub-race');

    if (!subSelect) return;
    subSelect.innerHTML = '';
    
    const raceData = speciesData[mainRace];
    
    // FIX: subtypes.options ist ein ARRAY, kein Objekt
    if (raceData && raceData.subtypes && raceData.subtypes.options) {
        raceData.subtypes.options.forEach(option => {
            subSelect.innerHTML += `<option value="${option.name}">${option.name}</option>`;
        });
        if (subContainer) subContainer.style.display = 'block';
    } else {
        if (subContainer) subContainer.style.display = 'none';
    }
    
    updateSubraceOptions();
}

function updateSubraceOptions() {
    const mainRace = document.getElementById('main-race').value;
    const subRace = document.getElementById('sub-race')?.value;
    const raceData = speciesData[mainRace];
    const specialContainer = document.getElementById('special-attr-container');
    const specialSelect = document.getElementById('special-attr-select');

    if (!raceData) {
        if (specialContainer) specialContainer.style.display = 'none';
        return;
    }

    // Finde die ausgewählte Subtype aus dem OPTIONS-ARRAY
    const selectedSubtype = raceData.subtypes?.options?.find(o => o.name === subRace);
    
    if (selectedSubtype && selectedSubtype.specialAttribute) {
        if (specialSelect) {
            specialSelect.innerHTML = '';
            selectedSubtype.specialAttribute.forEach(opt => 
                specialSelect.innerHTML += `<option value="${opt}">${opt}</option>`
            );
        }
        if (specialContainer) specialContainer.style.display = 'block';
    } else {
        if (specialContainer) specialContainer.style.display = 'none';
    }
    
    updateSpellsUI();
}

function onClassChange() {
    const clsName = document.getElementById('class-select').value;
    updateClassIconDisplay();

    const s1 = document.getElementById('skill1');
    const s2 = document.getElementById('skill2');
    if (!s1 || !s2) return;

    s1.innerHTML = ''; s2.innerHTML = '';

    // Fertigkeiten aus Klassen-JSON holen
    const clsInfo = classData[clsName];
    let skillOptions = [];
    
    if (clsInfo?.proficiencies?.skills?.from) {
        skillOptions = clsInfo.proficiencies.skills.from;
    } else {
        // Fallback-Fertigkeiten
        skillOptions = ["Akrobatik", "Athletik", "Einblick", "Wahrnehmung"];
    }

    skillOptions.forEach(sk => {
        s1.innerHTML += `<option value="${sk}">${sk}</option>`;
        s2.innerHTML += `<option value="${sk}">${sk}</option>`;
    });
    s1.selectedIndex = 0;
    s2.selectedIndex = skillOptions.length > 1 ? 1 : 0;

    validateSkills();
    updateSpellsUI();
}

function updateBgDynamicUI() {

function updateBgAsiUI() {
    const bgName = document.getElementById('bg-select').value;
    const bgObj = backgrounds[bgName];
    const slotsContainer = document.getElementById('bg-asi-slots');
    const mode = document.getElementById('bg-asi-mode').value;
    
    if (!slotsContainer) return;
    if (!bgObj || !bgObj.attributes) { slotsContainer.innerHTML = ''; return; }

    slotsContainer.innerHTML = '';
    let optionsHtml = bgObj.attributes.map(attr => `<option value="${attr}">${attrNamesDE[attr] || attr}</option>`).join('');

    if (mode === "2_1") {
        slotsContainer.innerHTML = `
            <div><label style="font-size:0.75rem;">+2 Attribut</label><select id="bg-asi-2" onchange="validateBgAsi()">${optionsHtml}</select></div>
            <div><label style="font-size:0.75rem;">+1 Attribut</label><select id="bg-asi-1a" onchange="validateBgAsi()">${optionsHtml}</select></div>
            <div></div>`;
        const sel1a = document.getElementById('bg-asi-1a');
        if (sel1a && bgObj.attributes.length > 1) sel1a.selectedIndex = 1;
    } else {
        slotsContainer.innerHTML = `
            <div><label style="font-size:0.75rem;">+1</label><select id="bg-asi-1a" onchange="validateBgAsi()">${optionsHtml}</select></div>
            <div><label style="font-size:0.75rem;">+1</label><select id="bg-asi-1b" onchange="validateBgAsi()">${optionsHtml}</select></div>
            <div><label style="font-size:0.75rem;">+1</label><select id="bg-asi-1c" onchange="validateBgAsi()">${optionsHtml}</select></div>`;
        const sel1a = document.getElementById('bg-asi-1a'), sel1b = document.getElementById('bg-asi-1b'), sel1c = document.getElementById('bg-asi-1c');
        if (sel1a && bgObj.attributes.length > 0) sel1a.selectedIndex = 0;
        if (sel1b && bgObj.attributes.length > 1) sel1b.selectedIndex = 1;
        if (sel1c && bgObj.attributes.length > 2) sel1c.selectedIndex = 2;
    }
    validateBgAsi();
}

function updateBgToolAndEquipmentUI() {
    const bgName = document.getElementById('bg-select').value;
    const bgObj = backgrounds[bgName];
    const container = document.getElementById('bg-dynamic-options-container');
    const toolWrapper = document.getElementById('bg-tool-choice-wrapper');
    const toolSelect = document.getElementById('bg-tool-select');
    const eqWrapper = document.getElementById('bg-eq-choice-wrapper');

    if (!container) return;
    if (!bgObj) { container.style.display = 'none'; return; }

    let hasChoices = false;
    
    // Werkzeug-Wahl prüfen
    if (bgObj.tools && bgObj.tools.choiceA && bgObj.tools.choiceA.options) {
        if (toolSelect) {
            toolSelect.innerHTML = '';
            bgObj.tools.choiceA.options.forEach(opt => toolSelect.innerHTML += `<option value="${opt}">${opt}</option>`);
        }
        if (toolWrapper) toolWrapper.style.display = 'block';
        hasChoices = true;
    } else if (toolWrapper) {
        toolWrapper.style.display = 'none';
    }

    // Ausrüstungswahl prüfen
    if (bgObj.equipment && bgObj.equipment.choiceA && bgObj.equipment.choiceB) {
        if (eqWrapper) eqWrapper.style.display = 'block';
        hasChoices = true;
    } else if (eqWrapper) {
        eqWrapper.style.display = 'none';
    }

    container.style.display = hasChoices ? 'block' : 'none';
}

function validateBgAsi() {
    const mode = document.getElementById('bg-asi-mode').value;
    const errElem = document.getElementById('bg-asi-error');
    if (!errElem) return true;

    let isValid = true;
    if (mode === "2_1") {
        const sel2 = document.getElementById('bg-asi-2');
        const sel1a = document.getElementById('bg-asi-1a');
        if (sel2 && sel1a && sel2.value === sel1a.value) isValid = false;
    } else {
        const v1 = document.getElementById('bg-asi-1a')?.value;
        const v2 = document.getElementById('bg-asi-1b')?.value;
        const v3 = document.getElementById('bg-asi-1c')?.value;
        if (v1 && v2 && v3 && (v1 === v2 || v1 === v3 || v2 === v3)) isValid = false;
    }
    errElem.style.display = isValid ? 'none' : 'block';
    return isValid;
}

function getBgBonuses() {
    const mode = document.getElementById('bg-asi-mode').value;
    let bonuses = { STR: 0, DEX: 0, CON: 0, INT: 0, WIS: 0, CHA: 0 };
    if (!validateBgAsi()) return bonuses;

    if (mode === "2_1") {
        const val2 = document.getElementById('bg-asi-2')?.value;
        const val1a = document.getElementById('bg-asi-1a')?.value;
        if (val2 && bonuses[val2] !== undefined) bonuses[val2] += 2;
        if (val1a && bonuses[val1a] !== undefined) bonuses[val1a] += 1;
    } else {
        const v1 = document.getElementById('bg-asi-1a')?.value;
        const v2 = document.getElementById('bg-asi-1b')?.value;
        const v3 = document.getElementById('bg-asi-1c')?.value;
        if (v1 && bonuses[v1] !== undefined) bonuses[v1] += 1;
        if (v2 && bonuses[v2] !== undefined) bonuses[v2] += 1;
        if (v3 && bonuses[v3] !== undefined) bonuses[v3] += 1;
    }
    return bonuses;
}

function getSelectedBgEquipmentAndTools(bgName) {
    const bgObj = backgrounds[bgName];
    if (!bgObj) return { tools: [], equipment: [] };

    let tools = bgObj.tools?.choiceA ? [document.getElementById('bg-tool-select')?.value] : (Array.isArray(bgObj.tools) ? bgObj.tools : [bgObj.tools]);
    let eqMode = document.getElementById('bg-eq-select')?.value || 'A';
    let equipment = eqMode === 'B' ? bgObj.equipment.choiceB : bgObj.equipment.choiceA;
    return { tools: tools.filter(Boolean), equipment: Array.isArray(equipment) ? equipment : [equipment] };
}

function getMod(score) { return Math.floor((score - 10) / 2); }

function validateArray() {
    const vals = Array.from(document.querySelectorAll('.array-select')).map(s => parseInt(s.value)).filter(v => !isNaN(v));
    const errElem = document.getElementById('array-error');
    if (!errElem) return true;
    const isValid = vals.length === 6 && new Set(vals).size === 6;
    errElem.style.display = isValid ? 'none' : 'block';
    return isValid;
}

function validateSkills() {
    const sk1 = document.getElementById('skill1')?.value;
    const sk2 = document.getElementById('skill2')?.value;
    const bgElem = document.getElementById('bg-select');
    const errElem = document.getElementById('skill-error');
    if (!errElem || !bgElem) return true;

    const bgSkills = backgrounds[bgElem.value]?.skills || [];
    const isValid = (sk1 && sk2 && sk1 !== sk2) && !bgSkills.includes(sk1) && !bgSkills.includes(sk2);
    errElem.style.display = isValid ? 'none' : 'block';
    return isValid;
}

function updateSpellsUI() {
    const clsName = document.getElementById('class-select')?.value;
    const cantripGroup = document.getElementById('cantrips-group');
    const lvl1Group = document.getElementById('level1-group');
    const cantripLabel = document.getElementById('cantrip-label');
    const prepLabel = document.getElementById('prep-spells-label');

    if (!cantripGroup || !lvl1Group) return;

    cantripGroup.innerHTML = ''; 
    lvl1Group.innerHTML = '';

    // Nicht-Zauberer-Klassen prüfen
    const nonCasters = ["Kämpfer", "Barbar", "Schurke", "Mönch"];
    if (nonCasters.includes(clsName)) {
        if (cantripLabel) cantripLabel.innerText = "Zaubertricks: Keine für diese Klasse.";
        if (prepLabel) prepLabel.innerText = "Stufe 1 Zauber: Keine für diese Klasse.";
        return;
    }

    // Zauber aus Klassen-JSON holen
    const clsInfo = classData[clsName];
    
    // Zaubertricks
    let allowedCantrips = [];
    let maxCantrips = 0;
    
    if (clsInfo?.spellcasting?.cantripsKnown) {
        const cantripConfig = clsInfo.spellcasting.cantripsKnown.find(c => c.level === 1);
        maxCantrips = cantripConfig?.count || 2;
        allowedCantrips = Object.keys(allSpells.cantrips);
    } else if (clsInfo?.spellcasting?.ability) {
        maxCantrips = 2;
        allowedCantrips = Object.keys(allSpells.cantrips);
    } else {
        if (cantripLabel) cantripLabel.innerText = "Zaubertricks: Keine für diese Klasse.";
        if (prepLabel) prepLabel.innerText = "Stufe 1 Zauber: Keine für diese Klasse.";
        return;
    }
    
    if (cantripLabel) cantripLabel.innerText = `Wähle ${maxCantrips} Zaubertricks:`;
    for (let i = 0; i < maxCantrips; i++) {
        let opts = allowedCantrips.map(c => `<option value="${c}">${c}</option>`).join('');
        cantripGroup.innerHTML += `<div class="input-row"><select class="char-cantrip-select"><option value="">-- Wählen --</option>${opts}</select><button type="button" class="info-btn" onclick="showSpellModalFromDropdown(this.previousElementSibling)">✨</button></div>`;
    }

    // Stufe 1 Zauber
    let allowedLvl1 = [];
    let maxPrep = 2;
    
    if (clsInfo?.spellcasting?.spellsPrepared) {
        allowedLvl1 = Object.keys(allSpells.level1);
    } else if (clsInfo?.spellcasting?.spellsKnown) {
        allowedLvl1 = Object.keys(allSpells.level1);
    } else {
        allowedLvl1 = Object.keys(allSpells.level1);
    }
    
    if (prepLabel) prepLabel.innerText = `Wähle Stufe 1 Zauber (Limit: ${maxPrep}):`;

    for (let i = 0; i < maxPrep; i++) {
        let opts = allowedLvl1.map(s => `<option value="${s}">${s}</option>`).join('');
        lvl1Group.innerHTML += `<div class="input-row"><select class="char-spell-select"><option value="">-- Wählen --</option>${opts}</select><button type="button" class="info-btn" onclick="showSpellModalFromDropdown(this.previousElementSibling)">I</button></div>`;
    }
}

function flattenEquipment(item) {
    let result = [];
    if (!item) return result;

    if (typeof item === 'string') {
        let cleaned = item.trim();
        if (cleaned && !cleaned.toLowerCase().startsWith('wähle') && !cleaned.startsWith('[object') && !cleaned.includes('{') && !cleaned.endsWith('GM') && !cleaned.endsWith('SM') && !cleaned.endsWith('KM')) {
            cleaned.split(/,| und /).forEach(p => {
                let sub = p.trim();
                if (sub && sub.length > 2 && !sub.toLowerCase().startsWith('wähle')) result.push(sub);
            });
        }
    } else if (Array.isArray(item)) {
        item.forEach(sub => result.push(...flattenEquipment(sub)));
    } else if (typeof item === 'object') {
        for (let key in item) {
            result.push(...flattenEquipment(item[key]));
        }
    }
    return result;
}

function accumulateItems(itemList) {
    let map = {};
    itemList.forEach(raw => {
        let flattened = flattenEquipment(raw);
        flattened.forEach(str => {
            let qty = "1";
            let name = str;

            let numMatch = str.match(/^(\d+)\s*(?:x\s*)?(.*)$/);
            if (numMatch) {
                qty = numMatch[1];
                name = numMatch[2].trim();
            } else {
                let lower = str.toLowerCase();
                if (lower.startsWith('ein ') || lower.startsWith('eine ') || lower.startsWith('einen ')) {
                    qty = "1";
                    name = str.replace(/^(ein|eine|einen)\s+/i, '').trim();
                } else if (lower.startsWith('zwei ')) {
                    qty = "2";
                    name = str.replace(/^zwei\s+/i, '').trim();
                } else if (lower.startsWith('drei ')) {
                    qty = "3";
                    name = str.replace(/^drei\s+/i, '').trim();
                } else if (lower.startsWith('vier ')) {
                    qty = "4";
                    name = str.replace(/^vier\s+/i, '').trim();
                } else if (lower.startsWith('fünf ')) {
                    qty = "5";
                    name = str.replace(/^fünf\s+/i, '').trim();
                } else if (lower.startsWith('zehn ')) {
                    qty = "10";
                    name = str.replace(/^zehn\s+/i, '').trim();
                }
            }

            name = name.replace(/[.,;]$/, '').trim();
            if (!name || name.length < 2) return;

            let key = name.toLowerCase();
            if (map[key]) {
                let q1 = parseInt(map[key].qty);
                let q2 = parseInt(qty);
                if (!isNaN(q1) && !isNaN(q2)) {
                    map[key].qty = (q1 + q2).toString();
                }
            } else {
                map[key] = { originalName: name, qty: qty };
            }
        });
    });
    return Object.values(map);
}

function renderEquipmentSectionInSheet(clsName, bgCustomData) {
    const container = document.getElementById('sheet-equipment-controls');
    if (!container) return;

    // Startausrüstung aus Klassen-JSON holen
    let classItems = [];
    const clsInfo = classData[clsName];
    
    if (clsInfo?.startingEquipment) {
        let startEq = clsInfo.startingEquipment;
        let allChoiceItems = [];
        
        if (startEq.choiceA) allChoiceItems.push(startEq.choiceA);
        if (startEq.choiceB) allChoiceItems.push(startEq.choiceB);
        if (startEq.additionalItems) allChoiceItems.push(...startEq.additionalItems);
        
        classItems = allChoiceItems.flat().filter(i => i?.name);
    } else {
        // Fallback (bis JSON vollständig ist)
        if (clsName === "Artifizier") classItems = [{name: "Dolch", qty: 1}, {name: "Schuppenpanzer", qty: 1}, {name: "Tüftlerwerkzeuge", qty: 1}, {name: "Materialkomponentenbeutel", qty: 1}];
        else if (clsName === "Barbar") classItems = [{name: "Zweihandaxt", qty: 1}, {name: "Wurfspeer", qty: 4}, {name: "Entdeckerausrüstung", qty: 1}];
        else if (clsName === "Barde") classItems = [{name: "Rapier", qty: 1}, {name: "Laute", qty: 1}, {name: "Diplomatenausrüstung", qty: 1}, {name: "Leder", qty: 1}];
        else if (clsName === "Kleriker") classItems = [{name: "Streitkolben", qty: 1}, {name: "Kettenhemd", qty: 1}, {name: "Heiliges Symbol", qty: 1}, {name: "Entdeckerausrüstung", qty: 1}];
        else if (clsName === "Kämpfer") classItems = [{name: "Langschwert", qty: 1}, {name: "Plattenpanzer", qty: 1}, {name: "Schild", qty: 1}, {name: "Gewölbeforscherausrüstung", qty: 1}];
        else classItems = [{name: "Dolch", qty: 1}, {name: "Entdeckerausrüstung", qty: 1}];
    }

    // Alle Items zusammenführen (Klasse + Hintergrund)
    let rawList = [classItems, bgCustomData.equipment, bgCustomData.tools];
    let accumulated = accumulateItems(rawList);

    let rowsHtml = accumulated.map(item => `
        <div style="display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1.5px solid var(--border); padding: 6px 10px; border-radius: 6px; margin-bottom: 6px;">
            <span style="color: var(--text); font-weight: bold;">
                <i class="fa-solid fa-box-open" style="color: var(--accent); margin-right: 6px;"></i>${item.originalName}
            </span>
            <span style="background: var(--btn-back-bg); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: var(--text);">
                Anzahl: ${item.qty}
            </span>
        </div>
    `).join('');

    container.innerHTML = `
        <div style="font-size:0.85rem; margin-bottom: 8px; color: var(--text-muted);"><b>Ausrüstungsliste (kumuliert):</b></div>
        <div style="display: flex; flex-direction: column;">${rowsHtml}</div>
    `;
}
